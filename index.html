<style>
:root{--bg:#f4f6fa;--card:#fff;--fg:#1b2330;--muted:#5d6878;--line:#dfe4ec;--acc:#1f6feb;--ok:#1a7f37;--okbg:#e6f4ea;--warn:#9a6700;--warnbg:#fff4d6;--bad:#c62828;--badbg:#fdecec}
@media (prefers-color-scheme:dark){:root{--bg:#0f141b;--card:#18202a;--fg:#e6edf3;--muted:#9aa7b4;--line:#2b3542;--acc:#4c8dff;--ok:#56d364;--okbg:#14301d;--warn:#e3b341;--warnbg:#332a10;--bad:#ff7b72;--badbg:#3a1616}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;padding-bottom:calc(72px + env(safe-area-inset-bottom))}
header{position:sticky;top:0;z-index:5;background:var(--acc);color:#fff;padding:calc(10px + env(safe-area-inset-top)) 16px 10px;display:flex;align-items:center;gap:8px}
header h1{font-size:18px;margin:0;flex:1}
header button{background:rgba(255,255,255,.2);color:#fff;border:0}
#testBadge{background:#ffd33d;color:#3b2f00;font-size:11px;font-weight:700;padding:3px 6px;border-radius:6px;white-space:nowrap}
header select{background:rgba(255,255,255,.2);color:#fff;border:0;font-size:15px;max-width:55%;padding:6px 8px}
header select option{color:#000}
header h1{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
main{max-width:760px;margin:0 auto;padding:12px 16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin:0 0 12px}
.card h2{font-size:17px;margin:0 0 8px}
.card h3{font-size:15px;margin:0 0 6px}
.muted{color:var(--muted);font-size:14px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.row>.grow{flex:1;min-width:120px}
.between{justify-content:space-between}
button,.btn{font:inherit;font-size:15px;padding:8px 12px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--fg);cursor:pointer;text-decoration:none;display:inline-block}
button.pri{background:var(--acc);border-color:var(--acc);color:#fff}
button.okb{background:var(--ok);border-color:var(--ok);color:#fff}
button.danger{color:var(--bad)}
button.small{padding:4px 8px;font-size:13px}
input,select,textarea{font:inherit;font-size:16px;padding:8px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--fg);max-width:100%}
input[type=number]{width:90px}

label.f{display:block;margin:8px 0}

.med .n{flex:1;min-width:140px}

.med.skipped{background:var(--badbg);margin:0 -14px;padding:8px 14px}
.badge{font-size:12px;padding:2px 8px;border-radius:99px;white-space:nowrap}
.b-ok{background:var(--okbg);color:var(--ok)}.b-bad{background:var(--badbg);color:var(--bad)}.b-mut{background:var(--line);color:var(--muted)}

.banner div{border-radius:10px;padding:10px 12px;display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap}

th,td{text-align:left;padding:6px 4px;border-bottom:1px solid var(--line)}

.neg{color:var(--bad);font-weight:600}
nav{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom);z-index:5}
nav button{flex:1;min-width:0;border:0;border-radius:0;background:none;padding:8px 1px;font-size:11px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:2px}
nav button .i{font-size:20px}

<body>
<header><h1 id="title">Diario Terapia</h1><span id="testBadge" hidden></span><select id="patSel" aria-label="Paziente" onchange="A.switchPatient(this.value)"></select><button id="installBtn" class="small" hidden></button></header>
<div id="byline" aria-hidden="true">By Antonio Chitano</div>
<div id="banner" class="banner"></div>
<main id="view"></main>
<nav id="tabs"></nav>
<input type="file" id="fileIn" accept="application/json,.json" hidden>
<script src="i18n.js"></script>
<script>
'use strict';
const KEY = 'diarioTerapia.v1';            // dati della versione con un solo paziente (migrati)
const PKEY = 'diarioTerapia.profiles';      // elenco pazienti, paziente attivo, lingua
const dataKey = id => KEY + '.' + id;
const uid = () => Math.random().toString(36).slice(2, 10);
const pad = n => String(n).padStart(2, '0');
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const parseD = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const addDays = (s, n) => { const d = parseD(s); d.setDate(d.getDate() + n); return ymd(d); };
const diffDays = (a, b) => Math.round((parseD(a) - parseD(b)) / 86400000);
const todayStr = () => ymd(new Date());
const nowHM = () => { const d = new Date(); return `${pad(d.getHours())}:${pad(d.getMinutes())}`; };
const h = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const num = v => { const n = parseFloat(String(v).replace(',', '.')); return isFinite(n) ? n : 0; };
const APP_VERSION = '1.0'; // aumentare di 0.1 a ogni rilascio (1.1, 1.2…) insieme a VERSION in sw.js
const fmtN = n => String(Math.round(n * 100) / 100);
// Singolare/plurale dell'unità: "1 compressa", "2 compresse". Vale per le unità più comuni in tutte le lingue.
const UNIT_FORMS = {
  it: [['compressa','compresse'],['iniezione','iniezioni'],['bustina','bustine'],['capsula','capsule'],['fiala','fiale'],['goccia','gocce'],
    ['flacone','flaconi'],['cerotto','cerotti'],['supposta','supposte'],['pastiglia','pastiglie'],['confetto','confetti'],['siringa','siringhe'],
    ['penna','penne'],['dose','dosi'],['spruzzo','spruzzi'],['inalazione','inalazioni'],['misurino','misurini'],['cucchiaio','cucchiai'],
    ['cucchiaino','cucchiaini'],['scatola','scatole'],['confezione','confezioni'],['giorno','giorni']],
  en: [['tablet','tablets'],['injection','injections'],['sachet','sachets'],['capsule','capsules'],['vial','vials'],['drop','drops'],['patch','patches'],
    ['pill','pills'],['suppository','suppositories'],['syringe','syringes'],['pen','pens'],['spray','sprays'],['spoon','spoons'],['box','boxes'],['dose','doses'],['day','days']],
  fr: [['comprimé','comprimés'],['injection','injections'],['sachet','sachets'],['gélule','gélules'],['ampoule','ampoules'],['goutte','gouttes'],
    ['seringue','seringues'],['suppositoire','suppositoires'],['capsule','capsules'],['dose','doses'],['jour','jours']],
  es: [['comprimido','comprimidos'],['inyección','inyecciones'],['sobre','sobres'],['cápsula','cápsulas'],['ampolla','ampollas'],['gota','gotas'],
    ['parche','parches'],['jeringa','jeringas'],['supositorio','supositorios'],['pastilla','pastillas'],['dosis','dosis'],['día','días']],
};
function unitFor(unit, qty) {
  const u = String(unit ?? ''); const m = u.match(/^(\s*)([^\s\d.,;:()]+)(.*)$/s); if (!m) return u;
  const w = m[2].toLowerCase(); const one = Number(qty) > 0 && Number(qty) <= 1;
  const langs = [P && P.lang, 'it', 'en', 'fr', 'es'].filter(l => UNIT_FORMS[l]);
  let pair; for (const l of langs) { pair = UNIT_FORMS[l].find(f => f[0] === w || f[1] === w); if (pair) break; } if (!pair) return u;
  let r = one ? pair[0] : pair[1];
  if (m[2][0] !== m[2][0].toLowerCase()) r = r[0].toUpperCase() + r.slice(1);
  return m[1] + r + m[3];
}


function defaultState() {
  return {
    settings: { lang: 'it', senderName: '', patientName: '', waNumber: '', cycleDays: 30, alertDays: 3, msgTemplate: '' },
    slots: ['08:00', '10:00', '13:00', '16:00', '20:00', '22:00'].map(time => ({ id: uid(), time, label: '' })),
    meds: [],      // {id, name, unit, stock}
    schedule: [],  // {id, slotId, medId, qty}
    cycles: [],    // {id, prepDate, days, items:[{medId, name, taken, short}]}
    log: {},       // "data|slotId|medId" -> {status, time, slotTime, medName, qty, unit}
    patient: { birth: '', cf: '', doctor: '', phone: '', allergies: '', notes: '' },
    docs: [],      // {id, kind:'plan'|'record', title, date, expiry, notes, fileName, fileType} - file in IndexedDB
  };
}
let S, P;
function normalize(d) {
  const x = Object.assign(defaultState(), d);
  x.settings = Object.assign(defaultState().settings, x.settings);
  x.patient = Object.assign(defaultState().patient, x.patient);
  return x;
}
function saveProfiles() { try { localStorage.setItem(PKEY, JSON.stringify(P)); } catch (e) {} }
function load() {
  try { P = JSON.parse(localStorage.getItem(PKEY) || 'null'); } catch (e) { P = null; }
  if (!P || !P.list || !P.list.length) {
    // primo avvio o migrazione dalla versione con un solo paziente
    let old = null;
    try { old = JSON.parse(localStorage.getItem(KEY) || 'null'); } catch (e) {}
    const id = uid(), d = normalize(old || {});
    P = { current: id, lang: d.settings.lang || 'it', list: [{ id, name: d.settings.patientName || 'Paziente 1' }] };
    try { localStorage.setItem(dataKey(id), JSON.stringify(d)); if (old) localStorage.removeItem(KEY); } catch (e) {}
    saveProfiles();
  }
  if (!P.list.some(p => p.id === P.current)) P.current = P.list[0].id;
  if (!P.firstUse) { P.firstUse = todayStr(); saveProfiles(); }
  try { S = normalize(JSON.parse(localStorage.getItem(dataKey(P.current)) || 'null') || {}); } catch (e) { S = defaultState(); }
}

// ---- licenza: 100 giorni di prova, poi codice di sblocco legato all'email ----
// Il codice è una firma ECDSA P-256 di "diario-terapia|<email>": l'app contiene solo la chiave pubblica,
// la chiave privata resta nel generatore di Antonio (non pubblicato).
const TRIAL_DAYS = 100, SUPPORT_EMAIL = 'dep.kit@gmail.com', PRICE = '3,90';
const LIC_PUB = {"kty":"EC","crv":"P-256","x":"JPoy5NR5MnjkYyJBAy9ndboHpzeq_se4KdPGF3ecS6w","y":"d7BVfjU9I3b-bqG86uaupOFuVOg43PREuxIdFPpiMQo"};
const B32 = '0123456789ABCDEFGHJKMNPQRSTVWXYZ';
function b32dec(str) {
  str = String(str).toUpperCase().replace(/O/g, '0').replace(/[IL]/g, '1').replace(/[^0-9A-Z]/g, '');
  let bits = 0, val = 0; const out = [];
  for (const c of str) { const i = B32.indexOf(c); if (i < 0) return null; val = ((val << 5) | i) & 0xfff; bits += 5; if (bits >= 8) { bits -= 8; out.push((val >> bits) & 255); } }
  return new Uint8Array(out);
}
const normEmail = e => String(e || '').trim().toLowerCase();
async function verifyLicense(email, code) {
  try {
    const sig = b32dec(code);
    if (!sig || sig.length !== 64 || !normEmail(email)) return false;
    const key = await crypto.subtle.importKey('jwk', { ...LIC_PUB, ext: true }, { name: 'ECDSA', namedCurve: 'P-256' }, false, ['verify']);
    return await crypto.subtle.verify({ name: 'ECDSA', hash: 'SHA-256' }, key, sig, new TextEncoder().encode('diario-terapia|' + normEmail(email)));
  } catch (e) { return false; }
}
let licensed = false, licChecked = false;
// se l'orologio del dispositivo viene spostato indietro si usa l'ultimo giorno già visto
const trialLeft = () => TRIAL_DAYS - diffDays([todayStr(), P.lastSeen || ''].sort().pop(), P.firstUse);
// inizio prova, ultimo giorno visto e licenza sono copiati anche in IndexedDB, Cache e cookie:
// cancellare solo una parte dei dati del sito non fa ripartire la prova
const META = {
  idb() { return new Promise(res => { try { const r = indexedDB.open('diarioTerapiaMeta', 1); r.onupgradeneeded = () => r.result.createObjectStore('m'); r.onsuccess = () => res(r.result); r.onerror = () => res(null); } catch (e) { res(null); } }); },
  async read() {
    const vals = [];
    try { const m = document.cookie.match(/(?:^|; )dtm=([^;]+)/); if (m) vals.push(JSON.parse(decodeURIComponent(m[1]))); } catch (e) {}
    try { const db = await this.idb(); if (db) vals.push(await new Promise(r => { const q = db.transaction('m').objectStore('m').get('meta'); q.onsuccess = () => r(q.result); q.onerror = () => r(null); })); } catch (e) {}
    try { if (window.caches) { const r = await (await caches.open('diarioTerapiaMeta')).match('meta'); if (r) vals.push(await r.json()); } } catch (e) {}
    return vals.filter(Boolean);
  },
  async write(v) {
    const str = JSON.stringify(v);
    try { document.cookie = 'dtm=' + encodeURIComponent(str) + ';max-age=315360000;path=/;SameSite=Lax'; } catch (e) {}
    try { const db = await this.idb(); if (db) db.transaction('m', 'readwrite').objectStore('m').put(v, 'meta'); } catch (e) {}
    try { if (window.caches) await (await caches.open('diarioTerapiaMeta')).put('meta', new Response(str)); } catch (e) {}
  },
};
async function syncMeta() {
  const all = [{ firstUse: P.firstUse, lastSeen: P.lastSeen, license: P.license }, ...await META.read()];
  const valid = x => typeof x === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(x);
  P.firstUse = all.map(x => x.firstUse).filter(valid).sort()[0] || todayStr();
  P.lastSeen = [todayStr(), ...all.map(x => x.lastSeen).filter(valid)].sort().pop();
  if (!P.license) P.license = all.map(x => x.license).find(x => x && x.email && x.code) || undefined;
  saveProfiles();
  await META.write({ firstUse: P.firstUse, lastSeen: P.lastSeen, license: P.license });
}
const locked = () => licChecked && !licensed && trialLeft() <= 0;

// ---- allegati (IndexedDB: localStorage è troppo piccolo per PDF e foto) ----
const IDB = {
  db: null,
  open() {
    if (this.db) return Promise.resolve(this.db);
    return new Promise((res, rej) => {
      const r = indexedDB.open('diarioTerapiaFiles', 1);
      r.onupgradeneeded = () => r.result.createObjectStore('files');
      r.onsuccess = () => res(this.db = r.result);
      r.onerror = () => rej(r.error);
    });
  },
  op(mode, fn) { return this.open().then(db => new Promise((res, rej) => { const tx = db.transaction('files', mode); const q = fn(tx.objectStore('files')); tx.oncomplete = () => res(q && q.result); tx.onerror = () => rej(tx.error); })); },
  put(id, blob) { return this.op('readwrite', s => s.put(blob, id)); },
  get(id) { return this.op('readonly', s => s.get(id)); },
  del(id) { return this.op('readwrite', s => s.delete(id)); },
};
const blobToDataURL = b => new Promise(r => { const f = new FileReader(); f.onload = () => r(f.result); f.readAsDataURL(b); });
const dataURLToBlob = u => fetch(u).then(r => r.blob());
function save() { try { localStorage.setItem(dataKey(P.current), JSON.stringify(S)); } catch (e) { alert('Errore di salvataggio: ' + e.message); } }

function t(k, v) {
  let s = (I18N[P.lang] || I18N.it)[k] ?? I18N.it[k] ?? k;
  if (v) for (const [a, b] of Object.entries(v)) s = s.split('{' + a + '}').join(b);
  return s;
}
const locale = () => LOCALES[P.lang] || 'it-IT';
const fmtDate = s => parseD(s).toLocaleDateString(locale(), { weekday: 'short', day: 'numeric', month: 'short', year: 'numeric' });

// ---- calcoli ----
const medById = id => S.meds.find(m => m.id === id);
const slotsSorted = () => [...S.slots].sort((a, b) => a.time.localeCompare(b.time));
// frequenza: il farmaco si dà ogni "every" giorni a partire da "from" (1 = ogni giorno)
const every = m => Math.max(1, Math.round(num(m && m.every) || 1));
function isDue(m, date) {
  const n = every(m);
  if (n === 1) return true;
  const from = m.from || date;
  return date >= from && diffDays(date, from) % n === 0;
}
const qtyPerDose = medId => S.schedule.filter(e => e.medId === medId).reduce((a, e) => a + num(e.qty), 0);
const dailyNeed = medId => qtyPerDose(medId) / every(medById(medId));
const adminsPerDay = medId => S.schedule.filter(e => e.medId === medId).length;
// dosi necessarie per i contenitori dei giorni start+1 .. start+days
function needFor(medId, start, days) {
  const m = medById(medId), q = qtyPerDose(medId);
  if (!m || q <= 0) return 0;
  let n = 0;
  for (let k = 1; k <= days; k++) if (isDue(m, addDays(start, k))) n++;
  return Math.round(q * n * 100) / 100;
}
// la soglia guarda il prossimo ciclo: parte dalla fine di quello in corso, oppure da oggi
function nextStart() { const c = S.cycles[S.cycles.length - 1]; return c && addDays(c.prepDate, c.days) > todayStr() ? addDays(c.prepDate, c.days) : todayStr(); }
const threshold = medId => needFor(medId, nextStart(), num(S.settings.cycleDays));
function freqLabel(m) { const n = every(m); return n === 1 ? t('freqDaily') : n === 7 ? t('freqWeekly') : t('freqEvery', { n }); }
function shortages() {
  return S.meds.filter(m => dailyNeed(m.id) > 0 && num(m.stock) < threshold(m.id))
    .map(m => ({ m, stock: num(m.stock), thr: threshold(m.id), miss: threshold(m.id) - num(m.stock) }));
}
function cycleInfo(date = todayStr()) {
  const c = S.cycles[S.cycles.length - 1];
  if (!c) return null;
  const day = diffDays(date, c.prepDate);
  const alertDays = num(S.settings.alertDays);
  return {
    c, day,
    start: addDays(c.prepDate, 1), end: addDays(c.prepDate, c.days),
    alert: addDays(c.prepDate, c.days - alertDays),
    left: c.days - day,
    inAlert: day >= c.days - alertDays && day <= c.days,
    ended: day > c.days,
  };
}

// ---- messaggio carenze ----
function shortMessage() {
  const lista = shortages().map(s => '- ' + s.m.name).join('\n');
  const tpl = (S.settings.msgTemplate || '').trim() || t('defaultMsg');
  return tpl.split('{nome}').join(S.settings.senderName || '')
    .split('{paziente}').join(S.settings.patientName || '')
    .split('{data}').join(fmtDate(todayStr()))
    .split('{lista}').join(lista || t('noShort'));
}
function download(name, text, type = 'text/plain;charset=utf-8') {
  const blob = new Blob(['﻿' + text], { type });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
}
function waUrl(text) {
  const nr = (S.settings.waNumber || '').replace(/\D/g, '').replace(/^00/, '');
  return 'https://wa.me/' + nr + '?text=' + encodeURIComponent(text);
}

// ---- azioni ----
let tab = 'today', viewDate = todayStr(), prepDateSel = todayStr();
const A = {
  tab(x) { tab = x; render(); window.scrollTo(0, 0); },
  shiftDate(n) { viewDate = n === 0 ? todayStr() : addDays(viewDate, n); render(); },
  setDate(v) { if (v) { viewDate = v; render(); } },
  mark(slotId, medId, status) {
    const k = `${viewDate}|${slotId}|${medId}`;
    const e = S.schedule.find(x => x.slotId === slotId && x.medId === medId);
    const m = medById(medId), sl = S.slots.find(x => x.id === slotId);
    if (!status) delete S.log[k];
    else S.log[k] = { status, time: viewDate === todayStr() ? nowHM() : sl.time, slotTime: sl.time, medName: m.name, qty: e ? e.qty : '', unit: m.unit };
    save(); render();
  },
  markAll(slotId) {
    S.schedule.filter(e => e.slotId === slotId && isDue(medById(e.medId), viewDate)).forEach(e => { if (!S.log[`${viewDate}|${slotId}|${e.medId}`]) A.mark(slotId, e.medId, 'given'); });
  },

    const pat = S.settings.patientName || '';

    if (fmt === 'csv') {
      // separatore ";" così Excel in italiano apre le colonne correttamente
      // numeri con la virgola decimale dove il foglio di calcolo se lo aspetta (it, fr, es)
      const dec = ['it', 'fr', 'es'].includes(P.lang);
      const cell = v => { v = String(v ?? ''); if (dec && /^-?\d+\.\d+$/.test(v)) v = v.replace('.', ','); return /[";\n]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v; };
      const line = r => r.map(cell).join(';');
      out = [...info.map(line), ...(info.length ? [''] : []), line(head), ...rows.map(line)].join('\r\n');
    } else {
      const w = head.map((x, i) => Math.max(String(x).length, ...rows.map(r => String(r[i] ?? '').length)));
      const line = r => r.map((v, i) => String(v ?? '').padEnd(w[i])).join('  ').trimEnd();
      out = [`${title}${pat ? ' - ' + pat : ''}`, fmtDate(todayStr()), '', ...info.map(r => r.join(': ')), ...(info.length ? [''] : []),
        line(head), w.map(n => '-'.repeat(n)).join('  '), ...rows.map(line)].join('\n');
    }
    const slug = (title + (pat ? '-' + pat : '')).toLowerCase().normalize('NFD').replace(/[^a-z0-9\u4e00-\u9fff]+/g, '-').replace(/^-|-$/g, '');

  },
  exportDiary() {
    const rows = Object.entries(S.log).map(([k, v]) => ({ d: k.split('|')[0], ...v })).sort((a, b) => (a.d + a.slotTime).localeCompare(b.d + b.slotTime));
    let out = `${t('diaryTitle')}${S.settings.patientName ? ' - ' + S.settings.patientName : ''}\n`, last = '';
    rows.forEach(r => {
      if (r.d !== last) { out += `\n${fmtDate(r.d)}\n`; last = r.d; }
      out += `  ${r.slotTime}  ${r.status === 'given' ? '✓ ' + t('given') + ' ' + r.time : '✗ ' + t('skippedLbl')}  ${r.medName} ${fmtN(num(r.qty))} ${unitFor(r.unit, num(r.qty))}\n`;
    });
    download(`diario-terapia-${todayStr()}.txt`, out);
  },
};
document.getElementById('fileIn').addEventListener('change', e => {
  const f = e.target.files[0]; if (!f) return;
  f.text().then(async txt => {
    let d;
    try { d = JSON.parse(txt.replace(/^\ufeff/, '')); if (!d.meds || !d.slots) throw 0; } catch (err) { alert(t('importErr')); return; }
    const files = d.files || {}; delete d.files;
    // il backup porta con sé l'inizio della prova: importarlo dopo aver cancellato i dati non fa ripartire i 100 giorni
    const dates = d.trialStart ? [d.trialStart] : [...(d.cycles || []).map(c => c.prepDate), ...Object.keys(d.log || {}).map(k => k.split('|')[0])];
    const start = dates.filter(x => /^\d{4}-\d{2}-\d{2}$/.test(x)).sort()[0];
    if (start && start < P.firstUse) { P.firstUse = start; saveProfiles(); await syncMeta(); }
    const lic = d.license; delete d.trialStart; delete d.license;
    if (!licensed && lic && await verifyLicense(lic.email, lic.code)) { P.license = lic; saveProfiles(); licensed = true; await syncMeta(); }
    // i documenti ricevono id nuovi così un backup importato due volte non sovrascrive gli allegati dell'altro paziente
    const remap = {};
    (d.docs || []).forEach(x => { remap[x.id] = uid(); x.id = remap[x.id]; });
    const name = (d.settings && d.settings.patientName) || t('patientDefault', { n: P.list.length + 1 });
    Promise.all(Object.entries(files).filter(([id]) => remap[id]).map(([id, u]) => dataURLToBlob(u).then(b => IDB.put(remap[id], b))))
      .then(() => { A.addPatient(name, d); alert(t('importDone')); });
    e.target.value = '';
  });
});

function viewToday() {
  const ci = cycleInfo(viewDate);
  let cyc = t('noCycle');
  if (ci) cyc = ci.day < 0 ? t('beforeCycle') : ci.day === 0 ? t('prepDay') : ci.ended ? t('cycleEnded') : t('dayOfCycle', { n: ci.day, tot: ci.c.days });
  let html = `<div class="card"><div class="datenav"><button onclick="A.shiftDate(-1)">◀</button><b>${h(fmtDate(viewDate))}</b><button onclick="A.shiftDate(1)">▶</button></div>

  if (!slots.length) return html + `<div class="card muted">${t('noSlots')}</div>`;
  slots.forEach(sl => {

      if (!L) html += `<button class="okb" onclick="A.mark('${sl.id}','${m.id}','given')">✓ ${t('give')}</button><button onclick="A.mark('${sl.id}','${m.id}','skipped')">✗ ${t('skip')}</button>`;

      else html += `<span class="muted">${t('skippedLbl')}</span><button class="small" onclick="A.mark('${sl.id}','${m.id}')">${t('undo')}</button>`;
      html += `</div>`;
    });
    html += `</div>`;
  });
  return html;
}

      <div class="row" style="margin-top:8px"><label class="f" style="margin:0"><span>${t('freq')}</span><select onchange="A.setEvery('${m.id}',this.value)">
        ${[[1, t('freqDaily')], [2, t('freqEvery', { n: 2 })], [3, t('freqEvery', { n: 3 })], [7, t('freqWeekly')], [14, t('freqEvery', { n: 14 })], [28, t('freqEvery', { n: 28 })], [30, t('freqEvery', { n: 30 })]].map(([n, l]) => `<option value="${n}" ${every(m) === n ? 'selected' : ''}>${h(l)}</option>`).join('')}
        ${[1, 2, 3, 7, 14, 28, 30].includes(every(m)) ? '' : `<option selected>${h(freqLabel(m))}</option>`}<option value="other">${h(t('freqOther'))}</option></select></label>
        ${every(m) > 1 ? `<label class="f" style="margin:0"><span>${t('freqFrom')}</span><input type="date" value="${h(m.from || '')}" onchange="A.medField('${m.id}','from',this.value)"></label>` : ''}</div>
      <div class="row" style="margin-top:8px"><label class="f" style="margin:0"><span>${t('medValue')}</span><input type="text" value="${h(m.value ?? '')}" onchange="A.medField('${m.id}','value',this.value)"></label>
      <label class="f grow" style="margin:0"><span>${t('medNotes')}</span><textarea style="min-height:44px" onchange="A.medField('${m.id}','notes',this.value)">${h(m.notes || '')}</textarea></label></div></div>`;
  });
  return html + exportBtns('stock');
}
function viewSupply() {
  const days = num(S.settings.cycleDays), ci = cycleInfo();
  let html = `<div class="card"><h2>${t('supply')}</h2><p class="muted">${h(t('supplyHelp', { a: S.settings.alertDays }))}</p>
    <div class="row"><label class="f"><span>${t('containers')}</span><input type="number" min="1" value="${days}" onchange="A.set('cycleDays',this.value)"></label>
    <label class="f"><span>${t('alertDays')}</span><input type="number" min="0" value="${h(S.settings.alertDays)}" onchange="A.set('alertDays',this.value)"></label></div>
    <p class="muted">${t('containersHelp')}</p>`;
  if (ci) html += `<h3>${t('currentCycle')}</h3><table>
    <tr><td>${t('prepDate')}</td><td>${fmtDate(ci.c.prepDate)}</td></tr>
    <tr><td>${t('cyclePrepared')}</td><td><input type="number" min="1" value="${ci.c.days}" onchange="if(confirm(t('resizeConfirm',{n:this.value})))A.resizeCycle(this.value);else render()"></td></tr>
    <tr><td>${t('startUse')}</td><td>${fmtDate(ci.start)}</td></tr>
    <tr><td>${t('endCycle')}</td><td>${fmtDate(ci.end)}</td></tr>
    <tr><td>${t('alertOn')}</td><td>${fmtDate(ci.alert)}</td></tr></table>
    ${ci.c.items.filter(i => i.short > 0).map(i => `<div class="neg" style="margin-top:6px">${h(i.name)}: ${h(t(i.short <= 1 ? 'missingForPrep1' : 'missingForPrep', { n: fmtN(i.short), u: unitFor(i.unit, i.short), d: Math.floor(i.taken / (i.need / ci.c.days)), g: unitFor(t('daysWord'), Math.floor(i.taken / (i.need / ci.c.days))) }))}</div>`).join('')}
    <div style="margin-top:8px"><button class="danger" onclick="A.undoPrep()">${t('undoPrep')}</button></div>`;
  html += `</div><div class="card"><h2>${t('prepare', { n: days })}</h2>
    <label class="f"><span>${t('prepDate')}</span><input type="date" value="${prepDateSel}" onchange="prepDateSel=this.value"></label>
    <h3>${t('preview')}</h3><table><tr><th></th><th class="num">${t('inStock')}</th><th class="num">${t('need')}</th><th class="num">${t('after')}</th></tr>`;
  S.meds.filter(m => dailyNeed(m.id) > 0).forEach(m => {
    const need = needFor(m.id, prepDateSel, days), after = num(m.stock) - need;
    html += `<tr><td>${h(m.name)}</td><td class="num">${fmtN(num(m.stock))}</td><td class="num">${fmtN(need)}</td><td class="num ${after < 0 ? 'neg' : ''}">${fmtN(after)}</td></tr>`;
  });
  html += `</table><div style="margin-top:10px"><button class="pri" onclick="A.prepare()">📦 ${t('prepare', { n: days })}</button></div></div>`;
  const sh = shortages();
  html += `<div class="card" id="short"><h2>${t('shortList')} (${sh.length})</h2><p class="muted">${t('shortHelp', { n: days, m: days * 2 })}</p>`;
  html += sh.length ? `<table><tr><th></th><th class="num">${t('inStock')}</th><th class="num">${t('threshold')}</th><th class="num">${t('missing')}</th></tr>${sh.map(s => `<tr><td>${h(s.m.name)}</td><td class="num">${fmtN(s.stock)}</td><td class="num">${fmtN(s.thr)}</td><td class="num neg">${fmtN(s.miss)} ${h(unitFor(s.m.unit, s.miss))}</td></tr>`).join('')}</table>` : `<div class="muted">${t('noShort')}</div>`;
  html += `<h3 style="margin-top:12px">${t('message')}</h3><pre>${h(shortMessage())}</pre>
    ${S.settings.waNumber ? '' : `<p class="muted">${t('waNoNumber')}</p>`}
    <div class="row"><button class="okb" onclick="A.sendWa()">💬 ${t('sendWa')}</button><button onclick="A.exportShort()">⬇ ${t('exportTxt')}</button><button onclick="A.copyMsg(this)">${t('copy')}</button></div></div>`;
  const prev = S.cycles.slice(0, -1).reverse();
  html += `<div class="card"><h2>${t('history')}</h2>${prev.length ? prev.map(c => `<div>${fmtDate(c.prepDate)} → ${fmtDate(addDays(c.prepDate, c.days))}</div>`).join('') : `<span class="muted">${t('none')}</span>`}</div>`;
  return html + exportBtns('supply');
}
function daysTo(s) { return s ? diffDays(s, todayStr()) : null; }
function expiringPlans() { return S.docs.filter(d => d.kind === 'plan' && d.expiry && daysTo(d.expiry) <= 30); }
function docList(kind) {
  const docs = S.docs.filter(d => d.kind === kind).sort((a, b) => (b.date || '').localeCompare(a.date || ''));
  if (!docs.length) return `<div class="muted">${t('noDocs')}</div>`;
  return docs.map(d => {
    let badge = '';
    if (kind === 'plan' && d.expiry) { const n = daysTo(d.expiry); badge = n < 0 ? `<span class="badge b-bad">${t('expired')}</span>` : n <= 30 ? `<span class="badge b-bad">${t('expiresIn', { n })}</span>` : `<span class="badge b-ok">${t('valid')}</span>`; }
    return `<div class="med"><div class="n"><input value="${h(d.title)}" style="width:100%;font-weight:600" onchange="A.docField('${d.id}','title',this.value)">
      <div class="muted">${d.date ? fmtDate(d.date) : ''}${kind === 'plan' ? ` · ${t('docExpiry')}: <input type="date" value="${h(d.expiry)}" onchange="A.docField('${d.id}','expiry',this.value)">` : ''} ${badge}</div>
      ${d.notes ? `<div style="white-space:pre-wrap;font-size:14px;margin-top:4px">${h(d.notes)}</div>` : ''}</div>
      ${d.fileName ? `<button class="small" onclick="A.openDoc('${d.id}')">📎 ${t('openFile')}</button>` : ''}
      <button class="small danger" onclick="A.delDoc('${d.id}')">🗑</button></div>`;
  }).join('');
}
function docForm(kind) {
  return `<details style="margin-top:10px"><summary><b>+ ${t('addDoc')}</b></summary>
    <label class="f"><span>${t('docTitle')}</span><input id="dTitle_${kind}"></label>
    <div class="row"><label class="f"><span>${t('docDate')}</span><input type="date" id="dDate_${kind}" value="${todayStr()}"></label>
    ${kind === 'plan' ? `<label class="f"><span>${t('docExpiry')}</span><input type="date" id="dExp_${kind}"></label>` : ''}</div>
    <label class="f"><span>${t('docNotes')}</span><textarea id="dNotes_${kind}" style="min-height:70px"></textarea></label>
    <label class="f"><span>${t('attachFile')}</span><input type="file" id="dFile_${kind}" accept="application/pdf,image/*,.doc,.docx,.txt"></label>
    <button class="pri" onclick="A.addDoc('${kind}')">${t('saveDoc')}</button></details>`;
}
function viewPatient() {
  const p = S.patient, inp = (f, type = 'text') => `<input type="${type}" value="${h(p[f])}" onchange="A.pat('${f}',this.value)">`;
  return `<div class="card"><h2>${t('patient')}</h2>
    <label class="f"><span>${t('patientName')}</span><input value="${h(S.settings.patientName)}" onchange="A.set('patientName',this.value)"></label>
    <div class="row"><label class="f grow"><span>${t('birthDate')}</span>${inp('birth', 'date')}</label><label class="f grow"><span>${t('fiscalCode')}</span>${inp('cf')}</label></div>
    <div class="row"><label class="f grow"><span>${t('doctor')}</span>${inp('doctor')}</label><label class="f grow"><span>${t('phone')}</span>${inp('phone', 'tel')}</label></div>
    <label class="f"><span>${t('allergies')}</span><textarea style="min-height:60px" onchange="A.pat('allergies',this.value)">${h(p.allergies)}</textarea></label>
    <label class="f"><span>${t('clinicalNotes')}</span><textarea style="min-height:80px" onchange="A.pat('notes',this.value)">${h(p.notes)}</textarea></label></div>
    <div class="card"><h2>📋 ${t('plans')}</h2>${docList('plan')}${docForm('plan')}</div>
    <div class="card"><h2>🩺 ${t('records')}</h2>${docList('record')}${docForm('record')}</div>`;
}
function licenseCard() {
  const left = trialLeft();
  const status = licensed ? `<p><span class="badge b-ok">✓ ${t('licActive')}</span> ${h(P.license.email)}</p>`
    : left > 0 ? `<p>${t('licTrial', { n: left, tot: TRIAL_DAYS })}</p>` : `<p class="neg">${t('licExpired', { tot: TRIAL_DAYS })}</p>`;
  if (licensed) return `<div class="card"><h2>🔑 ${t('licTitle')}</h2>${status}</div>`;
  return `<div class="card"><h2>🔑 ${t('licTitle')}</h2>${status}<p class="muted">${t('licHow', { price: PRICE, email: SUPPORT_EMAIL })}</p>
    <label class="f"><span>${t('licEmailLbl')}</span><input type="email" id="licEmail" value="${h(P.licEmail || '')}" autocomplete="email"></label>
    <button onclick="A.requestCode()">✉️ ${t('licRequest')}</button>
    <label class="f"><span>${t('licCodeLbl')}</span><textarea id="licCode" style="min-height:70px;font-family:monospace"></textarea></label>
    <button class="pri" onclick="A.unlock()">🔓 ${t('licUnlock')}</button></div>`;
}
function viewHelp() {
  const man = (I18N[P.lang] || I18N.it).manual || I18N.it.manual;
  return `<div class="card"><h2>✉️ ${t('support')}</h2><p>${t('supportText')}</p><p><a class="btn" href="mailto:${SUPPORT_EMAIL}?subject=${encodeURIComponent(t('appTitle'))}">${SUPPORT_EMAIL}</a></p></div>
    ${licenseCard()}
    <div class="card"><h2>📖 ${t('manualTitle')}</h2>${man.map(([ti, tx]) => `<h3 style="margin-top:12px">${h(ti)}</h3><p style="margin:0;white-space:pre-line">${h(tx)}</p>`).join('')}</div>
    <p class="muted" style="text-align:center">${t('appTitle')} · v${APP_VERSION} · By Antonio Chitano</p>`;
}
function viewLocked() {
  return `<div class="card"><h2>⏳ ${t('licLockedTitle')}</h2><p>${t('licLockedText', { tot: TRIAL_DAYS, price: PRICE })}</p></div>${licenseCard()}
    <div class="card"><h2>${t('backup')}</h2><p class="muted">${t('licBackupText')}</p><button onclick="A.exportJson()">⬇ ${t('exportJson')}</button></div>
    <div class="card"><h2>✉️ ${t('support')}</h2><a class="btn" href="mailto:${SUPPORT_EMAIL}">${SUPPORT_EMAIL}</a></div>`;
}
function viewSettings() {
  const s = S.settings, inp = (f, type = 'text', extra = '') => `<input type="${type}" value="${h(s[f])}" ${extra} onchange="A.set('${f}',this.value)">`;
  const pats = P.list.map(p => `<div class="med"><div class="n">${p.id === P.current ? '● ' : ''}<b>${h(p.name)}</b></div>
    ${p.id !== P.current ? `<button class="small" onclick="A.switchPatient('${p.id}')">${t('open')}</button>` : ''}
    <button class="small danger" onclick="A.delPatient('${p.id}')">🗑 ${t('deletePatient')}</button></div>`).join('');
  return `<div class="card"><div class="row between"><h2>👥 ${t('patients')}</h2><button class="pri" onclick="A.addPatient()">+ ${t('addPatient')}</button></div>
    <p class="muted">${t('patientsHelp')}</p>${pats}</div>
    <div class="card"><h2>${t('settings')}</h2>
    <label class="f"><span>${t('language')}</span><select onchange="A.set('lang',this.value)">${Object.entries(LANGS).map(([k, v]) => `<option value="${k}" ${k === P.lang ? 'selected' : ''}>${v}</option>`).join('')}</select></label>
    <label class="f"><span>${t('senderName')}</span>${inp('senderName')}</label>
    <label class="f"><span>${t('patientName')}</span>${inp('patientName')}</label>
    <label class="f"><span>${t('waNumber')}</span>${inp('waNumber', 'tel', `placeholder="${h(t('waNumberHint'))}"`)}<span>${t('waNumberHint')}</span></label>
    <div class="row"><label class="f"><span>${t('cycleDays')}</span>${inp('cycleDays', 'number', 'min="1"')}</label>
    <label class="f"><span>${t('alertDays')}</span>${inp('alertDays', 'number', 'min="0"')}</label></div>
    <label class="f"><span>${t('msgTemplate')}</span><textarea placeholder="${h(t('defaultMsg'))}" onchange="A.set('msgTemplate',this.value)">${h(s.msgTemplate)}</textarea><span>${h(t('msgTemplateHint'))}</span></label></div>
    <div class="card"><h2>${t('backup')}</h2><p class="muted">${t('backupHelp')}</p><div class="row"><button onclick="A.exportJson()">⬇ ${t('exportJson')}</button><button onclick="A.importJson()">⬆ ${t('importJson')}</button><button onclick="A.exportDiary()">⬇ ${t('exportDiary')}</button></div></div>`;
}
function renderBanner() {
  const ci = cycleInfo(), out = [];
  if (ci && ci.day >= 0) {
    if (ci.ended) out.push(`<div class="b-warn">⚠ ${t('cycleEnded')}<button class="small" onclick="A.tab('supply')">${t('open')}</button></div>`);
    else if (ci.inAlert) {
      const k = shortages().length;
      out.push(`<div class="${k ? 'b-warn' : 'b-info'}">${k ? '⚠ ' : ''}${t(k ? 'alertBanner' : 'alertBannerOk', { n: ci.left, k })}<button class="small" onclick="A.tab('supply');setTimeout(()=>document.getElementById('short').scrollIntoView(),50)">${t('open')}</button></div>`);
    }
  }
  if (licChecked && !licensed && trialLeft() <= 10) out.push(`<div class="b-warn">⏳ ${t('licEnding', { n: trialLeft() })}<button class="small" onclick="A.tab('help')">${t('open')}</button></div>`);
  expiringPlans().forEach(d => out.push(`<div class="b-warn">⚠ ${h(t('planBanner', { t: d.title, d: fmtDate(d.expiry) }))}<button class="small" onclick="A.tab('patient')">${t('open')}</button></div>`));
  document.getElementById('banner').innerHTML = out.join('<div style="height:6px;padding:0"></div>');
}
const TABS = [['today', '📅', 'tabToday'], ['therapy', '💊', 'tabTherapy'], ['stock', '📦', 'tabStock'], ['supply', '🚚', 'tabSupply'], ['patient', '👤', 'tabPatient'], ['settings', '⚙️', 'tabSettings'], ['help', '❓', 'tabHelp']];
function render() {
  document.documentElement.lang = P.lang;
  document.title = t('appTitle');
  document.getElementById('title').textContent = t('appTitle');
  // la copia su GitHub Pages è l'ambiente di prova, la produzione gira sulla NAS
  const tb = document.getElementById('testBadge'); tb.hidden = !/github\.io$|^localhost$|^127\./.test(location.hostname); tb.textContent = t('testBadge');
  document.getElementById('patSel').innerHTML = P.list.map(p => `<option value="${p.id}" ${p.id === P.current ? 'selected' : ''}>👤 ${h(p.name)}</option>`).join('') + `<option value="__new">+ ${h(t('addPatient'))}</option>`;
  if (locked()) {
    document.getElementById('tabs').innerHTML = '';
    document.getElementById('banner').innerHTML = '';
    document.getElementById('view').innerHTML = viewLocked();
  } else {
    document.getElementById('tabs').innerHTML = TABS.map(([k, i, l]) => `<button class="${tab === k ? 'on' : ''}" onclick="A.tab('${k}')"><span class="i">${i}</span><span class="l">${t(l)}</span></button>`).join('');
    renderBanner();
    document.getElementById('view').innerHTML = { today: viewToday, therapy: viewTherapy, stock: viewStock, supply: viewSupply, patient: viewPatient, settings: viewSettings, help: viewHelp }[tab]();
  }
  const ib = document.getElementById('installBtn'); ib.textContent = t('install'); ib.hidden = !deferredPrompt;
}

// ---- installazione PWA ----
let deferredPrompt = null;
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); deferredPrompt = e; render(); });
document.getElementById('installBtn').onclick = () => { if (deferredPrompt) { deferredPrompt.prompt(); deferredPrompt = null; render(); } };
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('sw.js').catch(() => {});
// richiede al browser di non cancellare i dati salvati
if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});

load(); render();
syncMeta().catch(() => {}).then(() => P.license ? verifyLicense(P.license.email, P.license.code) : false).then(ok => { licensed = ok; licChecked = true; render(); });
// aggiorna banner e "oggi" al cambio di giorno
let lastDay = todayStr();
setInterval(() => { if (todayStr() !== lastDay) { if (viewDate === lastDay) viewDate = todayStr(); lastDay = todayStr(); syncMeta().catch(() => {}); render(); } }, 60000);
</script>
</body>
</html>
